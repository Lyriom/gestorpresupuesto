<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- Valor del primer pintado; useTema.ts lo resuelve luego desde --c-app-bg. -->
    <meta name="theme-color" content="#0e1116" />
    <meta name="description" content="Gestor de presupuesto personal: reparte los ingresos del mes por temáticas, controla los gastos y sigue la evolución de los precios de tus facturas." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Presupuesto" />
    <title>Gestor de Presupuesto</title>
    <script>
      // Aplica el tema guardado antes de la primera pintura para que no haya
      // un destello de tema claro al recargar.
      ;(() => {
        try {
          const guardado = localStorage.getItem('tema')
          if (guardado === 'light' || guardado === 'dark') {
            document.documentElement.dataset.theme = guardado
          }
        } catch {
          /* localStorage bloqueado: se queda el tema oscuro por defecto */
        }
      })()
    </script>
    <script>
      // Registro del service worker, que hace la aplicación instalable en el
      // móvil. Se hace aquí y no en main.ts para no depender del arranque de Vue:
      // si el paquete falla, al menos la app sigue instalada y abre sin conexión.
      // Solo en producción: en desarrollo una caché de más despista más que ayuda.
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            /* sin service worker la aplicación funciona igual, solo no se instala */
          })
        })
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
