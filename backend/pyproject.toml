[project]
name = "gestor-presupuesto"
version = "0.1.0"
description = "API del gestor de presupuesto personal: presupuestos, temáticas y lectura de facturas PDF"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-multipart>=0.0.17",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "python-dateutil>=2.9",
    "aiofiles>=24.1",
    # Extracción de facturas en PDF (todo open source, sin servicios de pago)
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["B008"]  # Depends() en los valores por defecto es idiomático en FastAPI

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
