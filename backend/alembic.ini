[alembic]
script_location = alembic
prepend_sys_path = .
# La URL real se toma de la variable de entorno DATABASE_URL en alembic/env.py;
# aquí se deja vacía a propósito para no versionar credenciales.
sqlalchemy.url =

# Nombre de fichero con marca de tiempo para que el orden sea evidente.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
